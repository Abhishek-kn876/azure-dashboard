services:

  mongodb:
    image: mongo:7
    container_name: azure-dashboard-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - dashboard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azure-dashboard-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - dashboard-net
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: azure-dashboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - dashboard-net
    depends_on:
      - backend

volumes:
  mongo_data:

networks:
  dashboard-net:
    driver: bridge
